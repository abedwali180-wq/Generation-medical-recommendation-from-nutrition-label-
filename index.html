<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <title>تجربة الاستضافة المجانية</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f2f5;
        }

        .card {
            text-align: center;
            padding: 30px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #2ecc71;
        }
    </style>
</head>

<body>
    <div class="card">
        <h1>مبروك! الموقع يعمل بنجاح 🎉</h1>
        <p>لقد قمت بنشر أول صفحة ويب لك على استضافة GitHub Pages.</p>
    </div>
</body>

</html>
